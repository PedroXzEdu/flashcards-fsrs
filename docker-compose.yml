services:
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
      - "4173:4173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_POLL=true
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  backend:
    image: node:20
    working_dir: /app
    init: true
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./backend/.env
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: flashcards_fsrs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d flashcards_fsrs"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flashfsrs_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flashfsrs_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  tools:
    image: node:20
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
    command: sh

volumes:
  pgdata:
  backend_uploads:
