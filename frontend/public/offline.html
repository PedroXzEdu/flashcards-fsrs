<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <title>FlashFSRS — Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 1rem;
      }
      .container {
        text-align: center;
        max-width: 24rem;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b7280;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      .button {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: #7c3aed;
        color: #fff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">&#x1F4F6;</div>
      <h1>Sem conexão</h1>
      <p>
        Você está offline. Conecte-se à internet para continuar usando o
        FlashFSRS.
      </p>
      <a class="button" href="/">Tentar novamente</a>
    </div>
  </body>
</html>
