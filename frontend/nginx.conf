map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location ~ ^/(auth|decks|import|review-logs|analytics|metrics|health)(/|$) {
        if ($request_method ~ ^(POST|PUT|PATCH|DELETE)$) {
            proxy_pass http://backend:3000;
            break;
        }
        if ($http_x_requested_with = "XMLHttpRequest") {
            proxy_pass http://backend:3000;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    location /media/ {
        proxy_pass http://backend:3000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Proxies POST/PUT/PATCH/DELETE (API calls without explicit header)
        if ($request_method ~ ^(POST|PUT|PATCH|DELETE)$) {
            proxy_pass http://backend:3000;
            break;
        }
        # SPA fallback for GET/HEAD
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
